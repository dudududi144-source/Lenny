<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#0b0726"/>
<title>לֶנִי · גַּן שֶׁל אוֹרוֹת</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/heebo@5.0.12/index.css"/>
<style>
:root{--night:#0b0726;--deep:#1a1140;--gold:#ffd76a;--gold-soft:#ffe9a6;--coral:#f2549a;--mint:#7dffb8;--cream:#fff6ec;--violet:#7c4dff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;font-family:'Heebo',system-ui,sans-serif;color:var(--cream);background:var(--night);overflow:hidden;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 800px at 15% 10%,rgba(124,77,255,.35),transparent 60%),radial-gradient(900px 700px at 90% 90%,rgba(242,84,154,.25),transparent 55%),radial-gradient(800px 600px at 50% 100%,rgba(125,255,184,.12),transparent 60%),linear-gradient(180deg,#0b0726 0%,#16103a 55%,#0b0726 100%);background-attachment:fixed}
.stars::before,.stars::after{position:fixed;inset:0;pointer-events:none;z-index:0;content:''}
.stars::before{background-image:radial-gradient(1px 1px at 20% 30%,#fff 50%,transparent 100%),radial-gradient(1.5px 1.5px at 70% 80%,#fff 50%,transparent 100%),radial-gradient(1px 1px at 40% 60%,#ffe9a6 50%,transparent 100%),radial-gradient(2px 2px at 85% 20%,#fff 50%,transparent 100%),radial-gradient(1px 1px at 10% 85%,#fff 50%,transparent 100%),radial-gradient(1.5px 1.5px at 55% 15%,#ffe9a6 50%,transparent 100%);background-size:600px 600px;opacity:.55;animation:tw 6s ease-in-out infinite}
.stars::after{background-image:radial-gradient(1px 1px at 25% 75%,#fff 50%,transparent 100%),radial-gradient(1.5px 1.5px at 75% 40%,#ffe9a6 50%,transparent 100%),radial-gradient(2px 2px at 15% 55%,#fff 50%,transparent 100%);background-size:500px 500px;opacity:.35;animation:tw 9s ease-in-out infinite reverse}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:.75}}
#hero{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(20px,4vh,48px) 24px clamp(20px,3vh,32px);transition:opacity .9s,transform .9s,filter .9s}
#hero.hidden{opacity:0;transform:translateY(-12px) scale(.98);filter:blur(6px);pointer-events:none}
.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:rgba(255,246,236,.75)}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px)}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.7}}
.parent-link{color:rgba(255,246,236,.5);text-decoration:none;font-size:12px;padding:6px 10px;border-radius:8px;transition:color .2s,background .2s}
.parent-link:hover{color:var(--cream);background:rgba(255,255,255,.06)}
.hero-center{display:flex;flex-direction:column;align-items:center;gap:clamp(20px,3vh,32px);text-align:center;max-width:520px;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.lenny-wrap{position:relative;width:clamp(180px,38vmin,260px);height:clamp(180px,38vmin,260px);display:grid;place-items:center;animation:float 4.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.lenny-glow{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(255,215,106,.55) 0%,rgba(255,215,106,.18) 40%,transparent 70%);filter:blur(8px);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
.lenny-img{position:relative;width:70%;height:70%;object-fit:contain;filter:drop-shadow(0 8px 28px rgba(255,215,106,.4))}
.eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft);opacity:.85}
h1{font-size:clamp(56px,14vmin,104px);font-weight:700;line-height:.95;letter-spacing:-.02em;background:linear-gradient(180deg,#fff 0%,var(--gold) 60%,#ffb84d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(255,215,106,.15)}
.subtitle{font-size:clamp(20px,4vmin,26px);font-weight:500;color:var(--cream);opacity:.92}
.greeting{font-size:clamp(15px,3vmin,17px);color:rgba(255,246,236,.7);line-height:1.6;max-width:40ch;min-height:3.2em}
.cta{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;align-items:center;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:.15s}
.btn{appearance:none;border:0;cursor:pointer;width:100%;padding:18px 24px;border-radius:22px;font-family:inherit;font-weight:600;font-size:clamp(17px,3.4vmin,19px);color:#1a1140;background:linear-gradient(180deg,#ffe9a6 0%,var(--gold) 100%);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 12px 32px -8px rgba(255,215,106,.55);transition:transform .15s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 18px 40px -8px rgba(255,215,106,.7)}
.btn:active{transform:translateY(0)}
.btn.secondary{background:rgba(255,255,255,.06);color:var(--cream);border:1px solid rgba(255,255,255,.1);box-shadow:none;font-weight:500;backdrop-filter:blur(10px)}
.btn.secondary:hover{background:rgba(255,255,255,.1)}
.micro{font-size:12px;color:rgba(255,246,236,.5);letter-spacing:.02em}
#game{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center}
#game canvas{display:block}
@media (max-height:640px){.lenny-wrap{width:34vmin;height:34vmin}h1{font-size:clamp(44px,12vmin,72px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div id="hero">
    <header class="topbar">
      <span class="badge"><span class="dot"></span>הגן מחכה</span>
      <a href="#parent" class="parent-link" id="parentLink">פִּנַּת הַהוֹרִים ←</a>
    </header>
    <main class="hero-center">
      <div class="lenny-wrap">
        <div class="lenny-glow"></div>
        <img class="lenny-img" src="art/lenny.png" alt="לֶנִי"/>
      </div>
      <div class="eyebrow">גַּן שֶׁל אוֹרוֹת</div>
      <h1>לֶנִי</h1>
      <p class="subtitle">מסע קטן שגדל איתך</p>
      <p class="greeting" id="greeting">בְּרוּכָה הַבָּאָה לַגַּן שֶׁל אוֹרוֹת.</p>
    </main>
    <div class="cta">
      <button class="btn" id="startBtn">בּוֹאוּ נַתְחִיל אֶת הַמַּסָּע</button>
      <button class="btn secondary" id="continueBtn" hidden>הַמְשִׁיכִים מֵאֵיפֹה עָצַרְנוּ</button>
      <div class="micro">ללא פִּרְסוֹמוֹת · ללא רְכִישׁוֹת · הַכֹּל נִשְׁמָר בַּמָּסָךְ</div>
    </div>
  </div>
  <div id="game"></div>
  <script type="module" src="/src/entry.ts"></script>
</body>
</html>
